<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neeshan's Portfolio</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #facddc;
    }
    .card-container {
      background-color: rgb(229, 156, 167);
      border: 2px solid #ea88a9;
      box-shadow: 0 0 25px rgba(229, 156, 16, 0.3);
    }
    .badge-pill {
      background-color: rgba(223, 141, 165, 0.719);
      color: #facddc;
    }
    .avatar-circle {
      background: linear-gradient(135deg, #d98faf 0%, #f9f4bf 100%);
      border: 3px solid #e095be;
      box-shadow: 0 4px 12px rgba(178, 119, 160, 0.3);
    }
    body.dark-theme {
      background-color: #121212;
    }
    body.dark-theme .card-container {
      background-color: #1e1e1e;
      border: 2px solid #d98faf;
      box-shadow: 0 0 25px rgba(223, 141, 165, 0.4);
    }
    body.dark-theme .badge-pill {
      background-color: #ea88a9;
      color: #121212;
    }
    body.dark-theme p {
      color: #f3f4f6 !important;
    }
    body.dark-theme h1 {
      color: #f9f4bf !important;
    }
  </style> 
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

  <main class="w-full max-w-xl mx-auto pt-8">
    <!-- Wrapper to position the badge overlapping the card border -->
    <div class="relative mt-4">
      
      <!-- Top overlapping pill badge -->
      <div class="absolute -top-4 left-1/2 -translate-x-1/2 z-10">
        <span class="badge-pill px-5 py-1.5 rounded-full text-xs font-bold uppercase tracking-wider shadow-md">
          After: CSS Styled
        </span>
      </div>

      <!-- Main Card Container -->
      <div class="card-container rounded-3xl p-8 sm:p-10 pt-12 text-left relative">

        <div class="flex flex-col sm:flex-row sm:items-center gap-6 mb-6">
          <!-- Circular Avatar -->
          <div class="avatar-circle w-20 h-20 sm:w-24 sm:h-24 rounded-full flex items-center justify-center flex-shrink-0 mx-auto sm:mx-0">
            <span class="text-3xl sm:text-4xl font-extrabold text-slate-950">N</span>
          </div>

          <!-- Portfolio Title -->
          <div class="text-center sm:text-left">
            <h1 class="text-3xl sm:text-4xl font-extrabold text-[#facddc] tracking-tight">
              Neeshan's Portfolio
            </h1>
          </div>
        </div>

        <div class="mt-4">
          <p class="text-slate-100 text-lg sm:text-xl font-normal leading-relaxed">
            Hi, I am learning software architecture with Girls to Code 2026.
          </p>
        </div>

      </div>
    </div>
  </main>
           
  <!-- Dark Mode Toggle Button -->
  <button id="dark-mode-btn" class="mt-6 px-4 py-2 bg-slate-800 text-white rounded-lg shadow hover:bg-slate-700 transition">
    Toggle Dark Mode
  </button>

  <!-- Toggle Script -->
  <script src="Toggle.js"></script>

</body>
</html>
